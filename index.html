<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideeën">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Ideeënbank</title>
<style>
:root{--bg:#eef2f7;--grid:#d5dce8;--card:#fff;--ink:#0d1b2a;--mut:#5a6b80;--line:#c3cddb;--acc:#2563eb;--glow:rgba(37,99,235,.2);--panel:#f8fafc}
@media(prefers-color-scheme:dark){:root{--bg:#16181d;--grid:#20242c;--card:#1f232b;--ink:#e8eaee;--mut:#9aa1ad;--line:#2f3541;--acc:#6ea8fe;--glow:rgba(110,168,254,.25);--panel:#1a1d24}}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input,textarea,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--glow)}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
h1{font-size:18px;margin:0}
#app{display:flex;width:100%;height:100%}
#side{width:320px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:12px;min-height:0}
#side input{width:100%;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top button{padding:4px 8px;font-size:12px}
#list{flex:1;overflow:auto}
.it{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;cursor:pointer}
.it:hover,.it.sel{border-color:var(--acc)}.it small{display:block;color:var(--mut);font-size:11px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#bar #t{flex:1;min-width:120px;font-weight:700}#back{display:none}
#wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
#board{position:relative;width:3000px;height:2000px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.blk{position:absolute;width:230px;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.blk.drag{border-color:var(--acc);box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9}
.hd{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;color:var(--mut);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-bottom:1px solid var(--line);font-size:12px}
.hd span:last-child{cursor:pointer;padding:0 4px}
.blk textarea{width:100%;border:0;border-radius:0 0 8px 8px;min-height:90px;resize:both;background:transparent}
.blk img{display:block;width:100%;border-radius:0 0 8px 8px;pointer-events:none}
#empty{margin:auto;color:var(--mut);padding:20px;text-align:center}
@media(max-width:700px){#side{width:100%;border-right:0}#main{display:none}body.vb #side{display:none}body.vb #main{display:flex}#back{display:block}}
</style>
</head>
<body>
<div id="app">
<aside id="side">
<div class="top"><h1>Ideeënbank</h1></div>
<input id="add" placeholder="Nieuw idee: titel + Enter" enterkeyhint="done">
<input id="q" type="search" placeholder="zoek…">
<div id="list"></div>
</aside>
<section id="main">
<div id="empty">Kies een idee in de lijst of maak er een.</div>
<div id="ed" style="display:none;flex:1;flex-direction:column;min-height:0">
<div id="bar"><button id="back">← Lijst</button><input id="t"><button id="btxt">+ Tekst</button><button id="bimg">+ Afbeelding</button><input id="file" type="file" accept="image/*" style="display:none"><button id="del">Verwijder</button></div>
<div id="wrap"><div id="board"></div></div>
</div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === VUL HIER JE EIGEN GEGEVENS IN (Supabase > Project Settings > API) ===
const SUPABASE_URL="https://JOUW-PROJECT.supabase.co";
const SUPABASE_KEY="JOUW-ANON-PUBLIC-KEY";
// ========================================================================
const $=id=>document.getElementById(id);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let notes=[],sel=null,dragging=false;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>notes.find(n=>n.id===sel);
const items=n=>n.items||[];
function sortN(){notes.sort((a,b)=>a.created_at<b.created_at?-1:1);}
function renderList(){
 const q=$("q").value.toLowerCase();
 $("list").innerHTML=notes.filter(n=>!q||JSON.stringify(n).toLowerCase().includes(q)).map(n=>`<div class="it${n.id===sel?" sel":""}" data-id="${esc(n.id)}"><b>${esc(n.title)}</b><small>${items(n).length} blok(ken)</small></div>`).join("")||'<div style="color:var(--mut)">Nog niets. Typ hierboven een titel.</div>';
}
$("list").onclick=e=>{const el=e.target.closest(".it");if(el){sel=el.dataset.id;document.body.classList.add("vb");openIdea();renderList();}};
$("q").oninput=renderList;
function openIdea(){
 const n=cur();$("empty").style.display=n?"none":"flex";$("ed").style.display=n?"flex":"none";if(!n)return;
 $("t").value=n.title||"";renderBoard();}
function renderBoard(){
 const n=cur();if(!n)return;
 $("board").innerHTML=items(n).map(b=>`<div class="blk" data-id="${esc(b.id)}" style="left:${b.x}px;top:${b.y}px"><div class="hd"><span>⠿ ${b.type==="img"?"afbeelding":"tekst"}</span><span data-x="1">✕</span></div>${b.type==="img"?`<img src="${esc(b.url)}" alt="">`:`<textarea placeholder="Schrijf hier…">${esc(b.text)}</textarea>`}</div>`).join("");
}
async function saveItems(arr){const n=cur();if(!n)return;n.items=arr;renderList();
 const {error}=await sb.from("ideas").update({items:arr,updated_at:new Date().toISOString()}).eq("id",n.id);if(error)alert("Opslaan mislukt: "+error.message);}
$("board").addEventListener("pointerdown",e=>{
 const h=e.target.closest(".hd");if(!h||e.target.dataset.x)return;
 const el=h.parentElement,sx=e.clientX,sy=e.clientY,ox=el.offsetLeft,oy=el.offsetTop;
 h.setPointerCapture(e.pointerId);dragging=true;el.classList.add("drag");
 const mv=ev=>{el.style.left=Math.max(0,ox+ev.clientX-sx)+"px";el.style.top=Math.max(0,oy+ev.clientY-sy)+"px";};
 const up=()=>{h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
  el.classList.remove("drag");dragging=false;
  saveItems(items(cur()).map(b=>b.id===el.dataset.id?{...b,x:el.offsetLeft,y:el.offsetTop}:b));};
 h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
});
$("board").addEventListener("click",e=>{
 if(!e.target.dataset.x)return;const id=e.target.closest(".blk").dataset.id;
 saveItems(items(cur()).filter(b=>b.id!==id));renderBoard();});
$("board").addEventListener("change",e=>{
 if(e.target.tagName!=="TEXTAREA")return;const id=e.target.closest(".blk").dataset.id;
 saveItems(items(cur()).map(b=>b.id===id?{...b,text:e.target.value}:b));});
const pos=()=>{const w=$("wrap");return{x:Math.round(w.scrollLeft+20+Math.random()*120),y:Math.round(w.scrollTop+20+Math.random()*120)};};
const bid=()=>"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
$("btxt").onclick=()=>{saveItems([...items(cur()),{id:bid(),type:"text",text:"",...pos()}]);renderBoard();};
$("bimg").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 const path="uploads/"+bid()+"."+((f.name.split(".").pop()||"jpg").toLowerCase());
 const {error}=await sb.storage.from("images").upload(path,f,{contentType:f.type});
 if(error){alert("Upload mislukt: "+error.message);return;}
 const url=sb.storage.from("images").getPublicUrl(path).data.publicUrl;
 saveItems([...items(cur()),{id:bid(),type:"img",url,...pos()}]);renderBoard();};
$("t").onchange=async()=>{const v=$("t").value.trim(),n=cur();if(n&&v){n.title=v;renderList();await sb.from("ideas").update({title:v,updated_at:new Date().toISOString()}).eq("id",n.id);}};
$("back").onclick=()=>document.body.classList.remove("vb");
$("del").onclick=async()=>{const n=cur();if(n&&confirm("Dit idee verwijderen?")){sel=null;document.body.classList.remove("vb");notes=notes.filter(x=>x.id!==n.id);await sb.from("ideas").delete().eq("id",n.id);openIdea();renderList();}};
$("add").addEventListener("keydown",async e=>{
 if(e.key!=="Enter")return;const t=$("add").value.trim();if(!t)return;$("add").value="";
 const {data,error}=await sb.from("ideas").insert({title:t,items:[]}).select().single();
 if(error){alert("Opslaan mislukt: "+error.message);return;}
 if(!notes.find(n=>n.id===data.id)){notes.push(data);sortN();}
 sel=data.id;document.body.classList.add("vb");renderList();openIdea();});
async function load(){
 const {data,error}=await sb.from("ideas").select("*").order("created_at");
 if(error){alert("Laden mislukt: "+error.message);return;}
 notes=data;sortN();renderList();
 const typing=document.activeElement&&document.activeElement.tagName==="TEXTAREA";
 if(!dragging&&!typing){if(sel&&!cur())sel=null;openIdea();}}
let chan=null;
function live(){
 if(chan)sb.removeChannel(chan);
 chan=sb.channel("ideas").on("postgres_changes",{event:"*",schema:"public",table:"ideas"},p=>{
  if(dragging)return;
  if(p.eventType==="DELETE")notes=notes.filter(n=>n.id!==p.old.id);
  else{const i=notes.findIndex(n=>n.id===p.new.id);if(i<0)notes.push(p.new);else notes[i]=p.new;}
  sortN();renderList();
  const typing=document.activeElement&&document.activeElement.tagName==="TEXTAREA";
  if(!typing){if(sel&&!cur())sel=null;openIdea();}
 }).subscribe();}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
load();live();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
