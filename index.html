<!DOCTYPE html>
<html lang="nl">

<meta name="mobile-web-app-capable" content="yes">

<title>Ideeënbank</title>
<style>

html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
input,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px var(--glow)}
button{cursor:pointer}button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
h1{font-size:18px;margin:0 0 10px}
#app{display:flex;width:100%;height:100%}
#side{width:320px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:12px;min-height:0}
#side input,#side button{width:100%;margin-bottom:8px}
#labs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--mut)}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#list{flex:1;overflow:auto}
.it{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:8px;cursor:pointer}
.it:hover,.it.sel{border-color:var(--acc)}.it small{display:block;color:var(--mut);font-size:11px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#bar button{padding:6px 9px}#t{flex:1;min-width:140px;font-weight:700}#lab{width:170px}#back{display:none}
.cap{color:var(--mut)}.it .chip{display:inline-block;margin:3px 4px 0 0;cursor:default}
#zl{min-width:42px;text-align:center;color:var(--mut)}
#wrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
#board{position:relative;width:3000px;height:2000px;transform-origin:0 0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
#lines{position:absolute;left:0;top:0;width:3000px;height:2000px;pointer-events:none;color:var(--mut)}
#blocks{position:absolute;left:0;top:0;width:3000px;height:2000px}
.blk{position:absolute;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.blk.drag,.blk.lf{border-color:var(--acc);box-shadow:0 6px 18px rgba(0,0,0,.25)}.blk.drag{z-index:9}
.hd{display:flex;justify-content:space-between;align-items:center;height:24px;padding:0 8px;color:var(--mut);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;flex:none}
.hd span:last-child{display:flex;gap:10px}.hd i{font-style:normal;cursor:pointer;padding:0 3px}
.blk textarea{flex:1;width:100%;border:0;border-radius:0 0 8px 8px;resize:none;background:transparent;min-height:0}
.blk img{display:block;width:100%;height:auto;border-radius:0 0 8px 8px;pointer-events:none}
.rs{position:absolute;right:0;bottom:0;width:22px;height:22px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--mut) 50%);border-radius:0 0 8px 0;opacity:.55}
#empty{margin:auto;color:var(--mut);padding:20px;text-align:center}
@media(max-width:700px){#side{width:100%;border-right:0}#main{display:none}body.vb #side{display:none}body.vb #main{display:flex}#back{display:block}#lab{width:100%}}
</style>
</head>
<body>

<h1>Ideeënbank</h1>

<button id="photo">Foto als nieuw idee</button><input id="pfile" type="file" accept="image/*" style="display:none">

</div>
</section>
</div>

 L(n).forEach((k,i)=>{const a=bd.querySelector(`.blk[data-id="${k.a}"]`),b=bd.querySelector(`.blk[data-id="${k.b}"]`);if(!a||!b)return;

function setZ(v,mx,my){const w=$("wrap");v=Math.min(2,Math.max(.3,v));if(mx==null){mx=w.clientWidth/2;my=w.clientHeight/2;}
 const cx=(w.scrollLeft+mx)/z,cy=(w.scrollTop+my)/z;z=v;
 $("board").style.transform=`scale(${z})`;$("sizer").style.width=3000*z+"px";$("sizer").style.height=2000*z+"px";$("zl").textContent=Math.round(z*100)+"%";
 w.scrollLeft=cx*z-mx;w.scrollTop=cy*z-my;}

 const x0=Math.min(...B.map(b=>b.x)),y0=Math.min(...B.map(b=>b.y)),x1=Math.max(...B.map(b=>b.x+(b.w||230))),y1=Math.max(...B.map(b=>b.y+(b.type==="img"?(b.w||230):(b.h||150))));
 setZ(Math.min(1,(w.clientWidth-40)/(x1-x0+40),(w.clientHeight-40)/(y1-y0+40)),0,0);
 w.scrollLeft=Math.max(0,(x0-20)*z);w.scrollTop=Math.max(0,(y0-20)*z);}
$("fit").onclick=fitView;

$("wrap").addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();const r=$("wrap").getBoundingClientRect();setZ(z*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top);},{passive:false});

$("wrap").addEventListener("touchstart",e=>{pd=e.touches.length===2?dist(e.touches):0;},{passive:true});

function shrink(f,m=1600){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("resize")),"image/jpeg",.8);};
 im.onerror=()=>rej(new Error("Geen geldige afbeelding"));im.src=u;});}
async function upload(f){const b=await shrink(f),path="uploads/"+bid()+".jpg";

async function deliver(blob,name){const f=new File([blob],name,{type:blob.type});

function makePdf(jpeg,w,h){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=p=>{const b=typeof p==="string"?enc.encode(p):p;parts.push(b);len+=b.length;};
 const obj=(n,f)=>{offs[n]=len;add(n+" 0 obj\n");f();add("\nendobj\n");};
 const W=w/2,H=h/2,c=`q ${W} 0 0 ${H} 0 0 cm /Im Do Q`;
 add("%PDF-1.4\n");
 obj(1,()=>add("<< /Type /Catalog /Pages 2 0 R >>"));
 obj(2,()=>add("<< /Type /Pages /Kids [3 0 R] /Count 1 >>"));
 obj(3,()=>add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents 4 0 R /Resources << /XObject << /Im 5 0 R >> >> >>`));
 obj(4,()=>add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
 obj(5,()=>{add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);add(jpeg);add("\nendstream");});
 const x=len;add("xref\n0 6\n0000000000 65535 f \n");for(let i=1;i<=5;i++)add(String(offs[i]).padStart(10,"0")+" 00000 n \n");
 add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});}

 const n=cur(),B=I(n);if(!B.length){alert("Dit idee heeft nog geen blokken.");return;}
 const imgs={};await Promise.all(B.filter(b=>b.type==="img").map(b=>new Promise(r=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{imgs[b.id]=im;r();};im.onerror=r;im.src=b.url;})));
 const H=24,bw=b=>b.w||230,bh=b=>b.type==="img"?(imgs[b.id]?bw(b)*imgs[b.id].naturalHeight/imgs[b.id].naturalWidth:60)+H:(b.h||150);
 const x0=Math.min(...B.map(b=>b.x)),y0=Math.min(...B.map(b=>b.y)),x1=Math.max(...B.map(b=>b.x+bw(b))),y1=Math.max(...B.map(b=>b.y+bh(b)));
 const P=40,T=60,W=x1-x0+2*P,HH=y1-y0+2*P+T,S=Math.min(2,4000/Math.max(W,HH));
 const c=document.createElement("canvas");c.width=Math.round(W*S);c.height=Math.round(HH*S);const g=c.getContext("2d");g.scale(S,S);
 g.fillStyle="#fff";g.fillRect(0,0,W,HH);g.fillStyle="#0d1b2a";g.font="bold 26px system-ui,sans-serif";g.fillText(n.title,P,P+8);
 g.translate(P-x0,P+T-y0);g.strokeStyle=g.fillStyle="#5a6b80";g.lineWidth=2;
 const R=id=>B.find(b=>b.id===id);
 L(n).forEach(k=>{const a=R(k.a),b=R(k.b);if(!a||!b)return;const ac=[a.x+bw(a)/2,a.y+bh(a)/2],bc=[b.x+bw(b)/2,b.y+bh(b)/2],dx=bc[0]-ac[0],dy=bc[1]-ac[1];if(!dx&&!dy)return;
  const cl=(p,bk,sx,sy)=>{const t=Math.min(sx?bw(bk)/2/Math.abs(sx):1e9,sy?bh(bk)/2/Math.abs(sy):1e9);return[p[0]+sx*t,p[1]+sy*t];};
  const p=cl(ac,a,dx,dy),q=cl(bc,b,-dx,-dy),an=Math.atan2(q[1]-p[1],q[0]-p[0]);
  g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();
  g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[0]-12*Math.cos(an-.4),q[1]-12*Math.sin(an-.4));g.lineTo(q[0]-12*Math.cos(an+.4),q[1]-12*Math.sin(an+.4));g.closePath();g.fill();});
 B.forEach(b=>{const w=bw(b),h=bh(b);g.fillStyle="#fff";g.strokeStyle="#c3cddb";g.lineWidth=1;g.beginPath();g.roundRect(b.x,b.y,w,h,8);g.fill();g.stroke();
  g.save();g.beginPath();g.roundRect(b.x,b.y,w,h,8);g.clip();g.fillStyle=PAL[b.c||0]?PAL[b.c]+"66":"#eef2f7";g.fillRect(b.x,b.y,w,H);
  if(b.type==="img"){if(imgs[b.id])g.drawImage(imgs[b.id],b.x,b.y+H,w,h-H);}
  else{g.fillStyle="#0d1b2a";g.font="14px system-ui,sans-serif";let y=b.y+H+20;
   for(const para of String(b.text||"").split("\n")){let line="";for(const word of para.split(" ")){const t=line?line+" "+word:word;if(g.measureText(t).width>w-20&&line){g.fillText(line,b.x+10,y);y+=18;line=word;}else line=t;}g.fillText(line,b.x+10,y);y+=18;}}
  g.restore();});
 const name=(n.title||"idee").replace(/[^\w\-]+/g,"_");
 if(kind==="png")c.toBlob(b=>deliver(b,name+".png"),"image/png");
 else c.toBlob(async b=>deliver(makePdf(new Uint8Array(await b.arrayBuffer()),c.width,c.height),name+".pdf"),"image/jpeg",.92);}
$("png").onclick=()=>exportIdea("png");$("pdf").onclick=()=>exportIdea("pdf");
async function load(){
 const {data,error}=await sb.from("ideas").select("*").order("created_at");
 if(error){alert("Laden mislukt: "+error.message);return;}
 notes=data;sortN();renderList();if(!busy&&!typing()){if(sel&&!cur())sel=null;openIdea();}}
sb.channel("ideas").on("postgres_changes",{event:"*",schema:"public",table:"ideas"},p=>{
 if(busy)return;
 if(p.eventType==="DELETE")notes=notes.filter(n=>n.id!==p.old.id);
 else{const i=notes.findIndex(n=>n.id===p.new.id);if(i<0)notes.push(p.new);else notes[i]=p.new;}
 sortN();renderList();if(!typing()){if(sel&&!cur())sel=null;openIdea();}}).subscribe();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
load();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
